<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AMTCS Remote Control</title>

    <!-- Bulma CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css"
    />

    <style>
      .control-buttons {
        display: flex;
        gap: 1rem;
        margin-top: 1rem;
      }

      .pause-btn {
        font-size: 1.5rem;
      }

      .cancel-btn {
        font-size: 1.5rem;
        background-color: #ff3860;
        color: white;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden; /* prevent page scroll */
      }

      /* Make the log section itself a flex container */
      #log-section {
        flex: 1;                 /* this section expands immediately */
        display: flex;
        flex-direction: column;
        overflow: hidden;        /* prevents outer scroll */
      }

      /* Make the log box fill remaining space */
      #log-box {
        flex: 1;                 /* fills available space even when empty */
        min-height: 0;           /* CRITICAL: allows flexbox to shrink properly */
        overflow-y: auto;        /* scroll only inside logs */
        background: #f5f5f5;
        padding: 1rem;
        border: 1px solid #ddd;
        font-family: monospace;
        white-space: pre-wrap;
      }

      /* Top panel: spread items from the start to the end of the row */
      .top-panel-columns {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
      }
    </style>
  </head>

  <body class="p-5">
    <!-- TOP PANEL -->
    <section class="box">
      <div class="columns top-panel-columns">
        <!-- Access Code -->
        <div class="column is-2">
          <label class="label">Experiment Access Code</label>
          <input
            id="access-code"
            class="input"
            type="text"
            placeholder="Enter code"
          />
        </div>

        <!-- Server IP -->
        <div class="column is-2">
          <label class="label">Server IP/name</label>
          <input 
            id="server-ip" 
            class="input" 
            type="text" 
            placeholder="192.168.50.1/PL-PLE" 
          />
        </div>

        <!-- Connect Button -->
        <div class="column is-2">
          <button id="connect-btn" class="button is-link is-fullwidth">
            Connect to Server
          </button>
        </div>

        <!-- Server Status -->
        <div class="column is-2">
          <p class="heading">Server Status</p>
          <p id="server-status" class="has-text-weight-semibold">
            Disconnected
          </p>
        </div>

        <!-- Experiment Status -->
        <div class="column is-2">
          <p class="heading">Experiment Status</p>
          <p id="experiment-status" class="has-text-weight-semibold">Unknown</p>
        </div>
        <div class="column is-2">
          <button id="update-info-btn" class="button is-info is-fullwidth">
            Update Info
          </button>
        </div>
      </div>
    </section>
    
    <!-- EXPERIMENT CONTROL -->
    <section class="box mt-1">
      <div class="columns is-vcentered">

        <!-- Pause/Resume and Cancel Buttons -->
        <div class="column is-narrow mr-5">
          <div class="control-buttons mt-0">
            <h2 class="title is-4">Experiment Control</h2>
            <button id="pause-btn" class="button is-warning pause-btn">⏸</button>
            <button id="cancel-btn" class="button cancel-btn">■</button>
          </div>
        </div>
    
        <!-- Experiment Progress Bar -->
        <div class="column">
          <label class="label">Overall Progress</label>
          <progress id="exp-progress" class="progress is-success" value="0" max="100">
            0%
          </progress>
        </div>

      </div>
    </section>

    <!-- MAIN LOG VIEWER -->
    <section class="box" id="log-section">
      <h2 class="title is-4">Experiment Logs</h2>

      <div id="log-box">
        <p class="has-text-grey">No logs yet...</p>
      </div>
    </section>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
